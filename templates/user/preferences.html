{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="col-md-7 mx-auto card shadow p-4">

        <h2>Travel Preferences</h2>

        <form method="POST">

            {% csrf_token %}

            <label class="form-label">Travel Interests</label>
            <input type="text"
                   name="interests"
                   class="form-control mb-3"
                   value="{{ preference.interests }}"
                   required>

            <label class="form-label">Preferred Climate</label>
            <select name="climate"
                    class="form-select mb-3">
                <option value="Cool">Cool</option>
                <option value="Warm">Warm</option>
                <option value="Cold">Cold</option>
                <option value="Tropical">Tropical</option>
            </select>

            <label class="form-label">Budget</label>
            <input type="number"
                   name="budget"
                   class="form-control mb-3"
                   value="{{ preference.budget }}"
                   required>

            <label class="form-label">Travel Category</label>
            <select name="category"
                    class="form-select mb-3">
                <option value="Nature">Nature</option>
                <option value="Adventure">Adventure</option>
                <option value="Beach">Beach</option>
                <option value="Hill Station">Hill Station</option>
                <option value="Historical">Historical</option>
            </select>

            <button class="btn btn-primary w-100">
                Save Preferences
            </button>

        </form>

    </div>

</div>

{% endblock %}
