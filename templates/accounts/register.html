{% extends 'base.html' %}

{% block content %}

<div class="container py-5">
    <div class="col-md-5 mx-auto">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">
                Create Your Account
            </h2>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary w-100">
                    Register
                </button>
            </form>

            <p class="mt-3 text-center">
                Already registered?
                <a href="{% url 'login' %}">Login</a>
            </p>

        </div>

    </div>
</div>

{% endblock %}
